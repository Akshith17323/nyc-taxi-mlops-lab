# CD: deploy the image CI just built onto the app host, through the self-hosted runner there.
# The runner uses the host's instance profile; no AWS keys anywhere.
#
# Triggered by workflow_run, so this file always runs from the default branch: a pull request can't
# change what executes on your host. The `if` below also rejects CI runs that weren't pushes to
# this repository; a fork's PR from a branch named "main" would otherwise match `branches: [main]`.
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy, e.g. to roll back (default sha-<first 7 of the commit>)
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-app
  cancel-in-progress: false

jobs:
  deploy-app:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, lab-app]
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_TAG="${TAG:-sha-${SHA::7}}"
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait --remove-orphans
      - name: Smoke test
        run: |
          # Traefik answers 404 for a moment after it first starts, until its file provider loads the
          # route; --retry alone doesn't retry a 404.
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 http://localhost/version | tee /tmp/version.json
          echo
          if [ -n "$TAG" ]; then
            jq -e --arg t "$TAG" '.image_tag == $t' /tmp/version.json
          else
            jq -e --arg sha "$SHA" '.git_sha == $sha' /tmp/version.json
          fi
