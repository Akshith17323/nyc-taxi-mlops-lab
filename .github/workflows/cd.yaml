name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (deploy or rollback)"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      tag:
        description: "Image tag to deploy (default: sha-<first 7 of the commit>)"
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-app
  cancel-in-progress: false

jobs:
  deploy-app:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, lab-app]
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TAG: ${{ inputs.tag }}
      ACTION: ${{ inputs.action || 'deploy' }}
      LLM_HOST: ${{ vars.LLM_HOST }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy or Rollback
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          TARGET_TAG="${TAG:-sha-${SHA::7}}"

          if [ "$ACTION" = "rollback" ]; then
            live=$(deploy/web.sh live)
            echo "Current live colour is: $live"
            if [ "$live" = "blue" ]; then
              target="green"
            elif [ "$live" = "green" ]; then
              target="blue"
            else
              echo "Error: cannot rollback when live is '$live'" >&2
              exit 1
            fi
            echo "Smoke testing rollback target colour: $target..."
            deploy/web.sh smoke "$target"
            echo "Switching traffic to $target..."
            start_ts=$(date +%s%N)
            deploy/web.sh switch "$target"
            end_ts=$(date +%s%N)
            ms=$(( (end_ts - start_ts) / 1000000 ))
            echo "Rollback switch completed in ${ms}ms"
            deploy/web.sh status
            exit 0
          fi

          # Normal deployment path: blue-green
          live=$(deploy/web.sh live)
          echo "Current live colour: $live"
          if [ "$live" = "blue" ]; then
            idle="green"
            other="blue"
          else
            idle="blue"
            other="green"
          fi
          echo "Deploying $TARGET_TAG to idle colour: $idle"

          current_other=$(deploy/web.sh tag "$other")
          if [ "$current_other" = "none" ] || [ -z "$current_other" ]; then
            other_tag="$TARGET_TAG"
          else
            other_tag="$current_other"
          fi

          if [ "$idle" = "blue" ]; then
            export BLUE_TAG="$TARGET_TAG"
            export GREEN_TAG="$other_tag"
          else
            export GREEN_TAG="$TARGET_TAG"
            export BLUE_TAG="$other_tag"
          fi

          deploy/web.sh prepare
          docker compose -f deploy/compose.web.yaml pull
          docker compose -f deploy/compose.web.yaml up -d --remove-orphans

          echo "Running smoke tests on $idle with target SHA $SHA..."
          deploy/web.sh smoke "$idle" "$SHA"

          echo "Switching live traffic to $idle..."
          start_ts=$(date +%s%N)
          deploy/web.sh switch "$idle"
          end_ts=$(date +%s%N)
          ms=$(( (end_ts - start_ts) / 1000000 ))
          echo "Traffic switch completed in ${ms}ms"

          echo "Current deployment status:"
          deploy/web.sh status
