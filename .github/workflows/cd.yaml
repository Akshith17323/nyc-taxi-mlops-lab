name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, lab-app]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy app stack
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            head_sha="${{ github.event.workflow_run.head_sha }}"
            export IMAGE_TAG="sha-${head_sha:0:7}"
          fi
          echo "Deploying $IMAGE_PREFIX/app:$IMAGE_TAG..."
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait --remove-orphans
      - name: Smoke test
        run: |
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 http://127.0.0.1/version
          echo
          curl -fsS -X POST http://127.0.0.1/predict \
            -H 'Content-Type: application/json' \
            -d '{"pickup_zone_id": 132, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}'
